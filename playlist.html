<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOPIFY | Katalog playlist Musik</title>
    <link rel="stylesheet" href="playlist.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

     <header>
        <nav class="navbar">
            <h2 class="logo">LOOP<span>IFY</span></h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="genre.html">Genre</a></li>
                <li><a href="artist.html">Artist</a></li>
                <li><a href="playlist.html">Playlist</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
    </header>

    <!-- Header / Navbar dengan Search Bar di Kanan Atas -->
    <header class="navbar">
    <div class="logo-container">
        <!-- Logo LOOPIFY dengan warna gradasi persis SS -->
    </div>

    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search music..." class="search-input">
    </div>
</header>

    <!-- Konten Utama -->
    <main class="main-container">
        <section class="hero-section">
    <p class="hero-subtitle">WELCOME TO LOOPIFY</p>
    <h1>Discover Your <span class="loopify-title">Music</span></h1>
    <p>Explore your favorite music, discover new artists, and find the perfect playlist for every mood.</p>
</section>

        <!-- Tombol Filter Genre (Interaktif) -->
        <div class="genre-filters">
            <button onclick="filterGenre('all')" class="filter-btn active">All Playlist</button>
            <button onclick="filterGenre('Study time')" class="filter-btn">Study time</button>
            <button onclick="filterGenre('Love song')" class="filter-btn">Love song</button>
            <button onclick="filterGenre('Sad song')" class="filter-btn">Sad song</button>
            <button onclick="filterGenre('night drive')" class="filter-btn">night drive</button>
        </div>

        <!-- Grid Kartu Musik (Setiap card diberi attribute data-genre) -->
        <section class="music-grid" id="songGrid">
            
            <!-- Kartu 1: -->
            <div class="song-card" data-genre="Study time">
                <div class="image-box">
                    <img src="https://i.pinimg.com/1200x/1b/80/78/1b80783c9abcc0edb7718da0a3080986.jpg" alt="study time">
                </div>
                <div class="song-info">
                    <h3>Study Time</h3>
                    <div class="card-footer">
                    </div>
                </div>
            </div>

            <!-- Kartu 2: -->
            <div class="song-card" data-genre="jazz">
                <div class="image-box">
                    <img src="TR_Website_musik/foto/love song.jpg" alt="love song">
                </div>
                <div class="song-info">
                    <h3>Love song</h3>
                    <div class="card-footer">
                    </div>
                </div>
            </div>

            <!-- Kartu 3: -->
            <div class="song-card" data-genre="pop">
                <div class="image-box">
                    <img src="TR_Website_musik/foto/sad song.jpeg" alt="sad song">
                </div>
                <div class="song-info">
                    <h3>Sad song</h3>
                    <div class="card-footer">
                    </div>
                </div>
            </div>

            <!-- Kartu 4: -->
            <div class="song-card" data-genre="dangdut">
                <div class="image-box">
                    <img src="TR_Website_musik/foto/foto night song.jpg" alt="night">
                </div>
                <div class="song-info">
                    <h3>night drive</h3>
                    <div class="card-footer">
                    </div>
                </div>
            </div>

        </section>
    </main>

    

    <!-- JavaScript untuk Menjalankan Filter & Search Bar -->
    <script>
        // 1. Fungsi Filter Genre saat tombol genre diklik
        function filterGenre(genre) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const cards = document.querySelectorAll('.song-card');
            cards.forEach(card => {
                if (genre === 'all' || card.dataset.genre === genre) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // 2. Fungsi Live Search (Mencari lagu atau artis saat diketik)
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.song-card');
            
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                const artist = card.querySelector('.artist-name').innerText.toLowerCase();
                
                if (title.includes(term) || artist.includes(term)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
